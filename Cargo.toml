[workspace]
resolver = "3"
members = ["crates/api", "crates/worker", "crates/contracts", "crates/db", "crates/smoke"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98.1"

[workspace.dependencies]
mediadive-contracts = { path = "crates/contracts" }
mediadive-db = { path = "crates/db" }

anyhow = "1"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
metrics = "0.24.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "rustls", "charset"] }
metrics-exporter-prometheus = "0.18.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate",
] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
utoipa = { version = "5.5.0", features = ["chrono", "uuid"] }
uuid = { version = "1.26.1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
