{{- $g := .Values.garage }}
---
# garage.toml holds the RPC secret and admin token, so it is a Secret rather
# than a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: garage-config
  labels: {{- include "mediadive.labels" . | nindent 4 }}
stringData:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"

    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret = "{{ include "mediadive.secret" (dict "root" . "path" "garage.rpcSecret") }}"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.internal"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.internal"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "{{ include "mediadive.secret" (dict "root" . "path" "garage.adminToken") }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
  labels: {{- include "mediadive.labels" . | nindent 4 }}
stringData:
  # Consumed by CloudNativePG for backups, and by the init Job to import the key.
  ACCESS_KEY_ID: "{{ include "mediadive.secret" (dict "root" . "path" "garage.accessKeyId") }}"
  SECRET_ACCESS_KEY: "{{ include "mediadive.secret" (dict "root" . "path" "garage.secretAccessKey") }}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  labels: {{- include "mediadive.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ $g.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  labels: {{- include "mediadive.labels" . | nindent 4 }}
spec:
  replicas: 1
  # A single writer on one ReadWriteOnce volume: the old pod must release the
  # disk before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "mediadive.selector" (dict "name" "garage") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mediadive.labels" . | nindent 8 }}
        {{- include "mediadive.selector" (dict "name" "garage") | nindent 8 }}
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.1.0
          ports:
            - { name: s3, containerPort: 3900 }
            - { name: rpc, containerPort: 3901 }
            - { name: web, containerPort: 3902 }
            - { name: admin, containerPort: 3903 }
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true }
            - { name: data, mountPath: /var/lib/garage }
          readinessProbe:
            tcpSocket: { port: 3900 }
            initialDelaySeconds: 3
      volumes:
        - name: config
          secret:
            secretName: garage-config
        - name: data
          persistentVolumeClaim:
            claimName: garage-data
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  labels: {{- include "mediadive.labels" . | nindent 4 }}
spec:
  selector: {{- include "mediadive.selector" (dict "name" "garage") | nindent 4 }}
  ports:
    - { name: s3, port: 3900, targetPort: s3 }
    - { name: web, port: 3902, targetPort: web }
    - { name: admin, port: 3903, targetPort: admin }
---
# Garage refuses every write until a cluster layout exists, and the layout,
# key and buckets are one-time setup. Run as a post-install/post-upgrade hook
# and written to be safely repeatable: each step is guarded or tolerant, because
# a hook that fails on the second sync blocks every later deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init
  labels: {{- include "mediadive.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {{- include "mediadive.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: dxflrs/garage:v2.1.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until /garage status >/dev/null 2>&1; do
                echo "waiting for garage rpc"; sleep 2
              done

              # A node with no role has not been given a layout yet.
              if /garage status | grep -q 'NO ROLE ASSIGNED'; then
                id="$(/garage node id -q | cut -d@ -f1)"
                echo "assigning layout to ${id}"
                /garage layout assign -z {{ $g.zone }} -c {{ $g.capacity }} "${id}"
                /garage layout apply --version 1
              else
                echo "layout already assigned"
              fi

              /garage key import --yes -n {{ $g.keyName }} \
                "${ACCESS_KEY_ID}" "${SECRET_ACCESS_KEY}" || echo "key already present"

              for bucket in {{ $g.buckets.objects }} {{ $g.buckets.backups }}; do
                /garage bucket create "${bucket}" || echo "${bucket} already exists"
                /garage bucket allow --read --write "${bucket}" --key {{ $g.keyName }}
              done

              # Public read for images; the backup bucket stays private.
              /garage bucket website --allow {{ $g.buckets.objects }}
              echo "garage init complete"
          envFrom:
            - secretRef:
                name: garage-credentials
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true }
      volumes:
        - name: config
          secret:
            secretName: garage-config
