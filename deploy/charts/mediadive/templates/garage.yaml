{{- $g := .Values.garage }}
---
# garage.toml holds the RPC secret and admin token, so it is a Secret rather
# than a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: garage-config
  labels: {{- include "mediadive.labels" . | nindent 4 }}
stringData:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"

    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret = "{{ include "mediadive.secret" (dict "root" . "path" "garage.rpcSecret") }}"

    [s3_api]
    s3_region = "{{ $g.region }}"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.internal"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.internal"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "{{ include "mediadive.secret" (dict "root" . "path" "garage.adminToken") }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
  labels: {{- include "mediadive.labels" . | nindent 4 }}
stringData:
  # Consumed by CloudNativePG for backups, and by the init Job to import the key.
  ACCESS_KEY_ID: "{{ include "mediadive.secret" (dict "root" . "path" "garage.accessKeyId") }}"
  SECRET_ACCESS_KEY: "{{ include "mediadive.secret" (dict "root" . "path" "garage.secretAccessKey") }}"
  # Garage signs SigV4 against its own region name, and boto3 has no default to
  # fall back on. Without this, barman's HeadBucket is rejected with a bare
  # `400 Bad Request` and WAL archiving fails with no useful message.
  REGION: "{{ $g.region }}"
  # The init Job drives the admin API rather than the garage CLI; see the Job.
  ADMIN_TOKEN: "{{ include "mediadive.secret" (dict "root" . "path" "garage.adminToken") }}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  labels: {{- include "mediadive.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ $g.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  labels: {{- include "mediadive.labels" . | nindent 4 }}
spec:
  replicas: 1
  # A single writer on one ReadWriteOnce volume: the old pod must release the
  # disk before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "mediadive.selector" (dict "name" "garage") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mediadive.labels" . | nindent 8 }}
        {{- include "mediadive.selector" (dict "name" "garage") | nindent 8 }}
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.1.0
          ports:
            - { name: s3, containerPort: 3900 }
            - { name: rpc, containerPort: 3901 }
            - { name: web, containerPort: 3902 }
            - { name: admin, containerPort: 3903 }
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true }
            - { name: data, mountPath: /var/lib/garage }
          readinessProbe:
            tcpSocket: { port: 3900 }
            initialDelaySeconds: 3
      volumes:
        - name: config
          secret:
            secretName: garage-config
        - name: data
          persistentVolumeClaim:
            claimName: garage-data
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  labels: {{- include "mediadive.labels" . | nindent 4 }}
spec:
  selector: {{- include "mediadive.selector" (dict "name" "garage") | nindent 4 }}
  ports:
    - { name: s3, port: 3900, targetPort: s3 }
    - { name: web, port: 3902, targetPort: web }
    - { name: admin, port: 3903, targetPort: admin }
---
# Garage refuses every write until a cluster layout exists, and the layout,
# key and buckets are one-time setup. Run as a post-install/post-upgrade hook
# and written to be safely repeatable: each step is guarded or tolerant, because
# a hook that fails on the second sync blocks every later deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init
  labels: {{- include "mediadive.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {{- include "mediadive.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          # NOT the garage image. `dxflrs/garage` is built from scratch — it
          # contains `/garage` and nothing else, no /bin/sh — so any shell
          # script here dies at container creation with
          # `exec: "/bin/sh": no such file or directory` and produces no logs.
          #
          # The CLI is unusable from a separate pod anyway: it reaches the
          # server over RPC on 3901, which `rpc_public_addr` pins to
          # 127.0.0.1 and which the Service does not publish. The admin API on
          # 3903 has none of those problems, so this drives that instead.
          #
          # Python rather than curl because every step needs a field out of a
          # JSON response, and neither the curl nor the alpine image ships jq.
          # The standard library covers it with no packages to install at run
          # time.
          image: python:3.13-alpine
          command: ["python3", "-c"]
          args:
            - |
              import json, os, sys, time, urllib.error, urllib.request

              ADMIN   = "http://garage:3903"
              TOKEN   = os.environ["ADMIN_TOKEN"]
              KEY_ID  = os.environ["ACCESS_KEY_ID"]
              KEY_SEC = os.environ["SECRET_ACCESS_KEY"]
              KEY_NAME = {{ $g.keyName | quote }}
              ZONE     = {{ $g.zone | quote }}
              CAPACITY = {{ $g.capacity | quote }}
              OBJECTS  = {{ $g.buckets.objects | quote }}
              BACKUPS  = {{ $g.buckets.backups | quote }}

              def api(method, path, body=None):
                  data = json.dumps(body).encode() if body is not None else None
                  req = urllib.request.Request(ADMIN + path, data=data, method=method)
                  req.add_header("Authorization", "Bearer " + TOKEN)
                  if data:
                      req.add_header("Content-Type", "application/json")
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          raw = r.read()
                          return r.status, (json.loads(raw) if raw else None)
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode("utf-8", "replace")
                  except urllib.error.URLError as e:
                      return 0, str(e)

              def need(code, body, what, ok=(200,)):
                  if code not in ok:
                      sys.exit("%s failed: HTTP %s %s" % (what, code, body))
                  return body

              def to_bytes(v):
                  # Garage's CLI takes "40GB"; the API wants an integer.
                  t = str(v).strip().upper()
                  for suffix, mult in (("TIB", 1024 ** 4), ("GIB", 1024 ** 3),
                                       ("MIB", 1024 ** 2), ("TB", 10 ** 12),
                                       ("GB", 10 ** 9), ("MB", 10 ** 6)):
                      if t.endswith(suffix):
                          return int(float(t[: -len(suffix)]) * mult)
                  return int(t)

              # Every step below is guarded, because this runs as a
              # post-upgrade hook — it executes on each sync, and a hook that
              # fails the second time blocks every later deploy.

              for _ in range(150):
                  code, _b = api("GET", "/v2/GetClusterStatus")
                  if code == 200:
                      break
                  print("waiting for the garage admin api", flush=True)
                  time.sleep(2)
              else:
                  sys.exit("garage admin api never became ready")

              status = need(*api("GET", "/v2/GetClusterStatus"), "GetClusterStatus")
              nodes = status["nodes"]
              if len(nodes) != 1:
                  sys.exit("expected exactly one garage node, found %d" % len(nodes))
              node = nodes[0]

              if node.get("role"):
                  print("layout already assigned")
              else:
                  layout = need(*api("GET", "/v2/GetClusterLayout"), "GetClusterLayout")
                  need(*api("POST", "/v2/UpdateClusterLayout", {
                      "roles": [{"id": node["id"], "zone": ZONE,
                                 "capacity": to_bytes(CAPACITY), "tags": []}],
                  }), "UpdateClusterLayout")
                  need(*api("POST", "/v2/ApplyClusterLayout",
                            {"version": layout["version"] + 1}), "ApplyClusterLayout")
                  print("layout applied: zone=%s capacity=%s" % (ZONE, CAPACITY))

              code, _b = api("GET", "/v2/GetKeyInfo?id=" + KEY_ID)
              if code == 200:
                  print("s3 key already imported")
              else:
                  need(*api("POST", "/v2/ImportKey", {
                      "accessKeyId": KEY_ID,
                      "secretAccessKey": KEY_SEC,
                      "name": KEY_NAME,
                  }), "ImportKey")
                  print("s3 key imported")

              for alias, website in ((OBJECTS, True), (BACKUPS, False)):
                  code, info = api("GET", "/v2/GetBucketInfo?globalAlias=" + alias)
                  if code == 404:
                      # CreateBucket answers 409 if it lost a race with another
                      # run; re-read rather than fail.
                      code, info = api("POST", "/v2/CreateBucket", {"globalAlias": alias})
                      if code == 409:
                          code, info = api("GET", "/v2/GetBucketInfo?globalAlias=" + alias)
                      need(code, info, "CreateBucket " + alias)
                      print("bucket created: " + alias)
                  else:
                      need(code, info, "GetBucketInfo " + alias)

                  need(*api("POST", "/v2/AllowBucketKey", {
                      "bucketId": info["id"],
                      "accessKeyId": KEY_ID,
                      "permissions": {"read": True, "write": True, "owner": False},
                  }), "AllowBucketKey " + alias)

                  # Public read for images; the backup bucket stays private.
                  if website and not info.get("websiteAccess"):
                      need(*api("POST", "/v2/UpdateBucket?id=" + info["id"], {
                          "websiteAccess": {"enabled": True, "indexDocument": "index.html"},
                      }), "UpdateBucket " + alias)
                      print("website access enabled: " + alias)

              print("garage init complete")
          envFrom:
            - secretRef:
                name: garage-credentials
