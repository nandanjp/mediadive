---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "mediadive.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "mediadive.selector" (dict "name" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mediadive.labels" . | nindent 8 }}
        {{- include "mediadive.selector" (dict "name" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          # A pure cache: no persistence, nothing to back up, repopulated from
          # Postgres on restart. Eviction rather than OOM when full.
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - {{ .Values.redis.maxmemory | quote }}
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "mediadive.labels" . | nindent 4 }}
spec:
  selector: {{- include "mediadive.selector" (dict "name" "redis") | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
