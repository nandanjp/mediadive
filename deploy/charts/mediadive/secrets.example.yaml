# Shape of the SOPS-encrypted values file. Copy to secrets.sops.yaml, fill in
# real values, encrypt with `sops -e -i`, and commit the encrypted result.
#
# Requires the age public recipient in .sops.yaml, which the bootstrap session
# generates — see deploy/BOOTSTRAP.md step 3. Never commit this file with real
# values in plaintext; the repository is public.
#
# Generate each with: openssl rand -hex 32

secrets:
  garage:
    # Cluster RPC secret and admin token.
    rpcSecret: ""
    adminToken: ""
    # S3 credentials. Chosen by us rather than generated by Garage, so the chart
    # is self-contained: the init Job imports these rather than the cluster
    # having to be queried for credentials it invented.
    accessKeyId: ""
    secretAccessKey: ""
  meilisearch:
    masterKey: ""
