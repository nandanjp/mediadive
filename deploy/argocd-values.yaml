# Argo CD values — installed by hand at bootstrap, not reconciled by Argo itself.
#
#   helm upgrade --install argocd argo/argo-cd -n argocd \
#     --version 10.9.2 -f deploy/argocd-values.yaml
#
# The whole point of this file is to teach the repo-server to decrypt SOPS,
# which Argo CD cannot do natively. It follows the upstream helm-secrets
# "Option 2: Init Container" recipe, trimmed to the sops/age backend:
# https://github.com/jkroepke/helm-secrets/wiki/ArgoCD-Integration
#
# Deviations from upstream's example, deliberate:
#   - age, not GPG. `HELM_SECRETS_LOAD_GPG_KEYS` is replaced by
#     `SOPS_AGE_KEY_FILE`, and the secret is `sops-age` (BOOTSTRAP.md step 3).
#   - `vals` and `kubectl` are not downloaded. They serve the `vals` backend and
#     the `secrets+*-import-kubernetes://` schemes, neither of which this
#     repository uses — see docs/DELIVERY.md, "Secrets".
#
# Every downloaded version is pinned. Bumping one is a commit, so the
# repo-server never silently changes underneath a sync.

configs:
  cm:
    # Argo CD allows only http/https value-file schemes by default; the
    # helm-secrets downloader plugin schemes have to be opted in.
    helm.valuesFileSchemes: >-
      secrets, secrets+literal,
      secrets+age-import, secrets+age-import-kubernetes,
      https

  params:
    # Single-node homelab: no HA, and the redis/dex split is not worth the pods.
    server.insecure: true

repoServer:
  env:
    - name: HELM_PLUGINS
      value: /gitops-tools/helm-plugins/
    - name: HELM_SECRETS_CURL_PATH
      value: /gitops-tools/curl
    - name: HELM_SECRETS_SOPS_PATH
      value: /gitops-tools/sops
    - name: HELM_SECRETS_AGE_PATH
      value: /gitops-tools/age
    - name: HELM_SECRETS_BACKEND
      value: sops
    - name: HELM_SECRETS_HELM_PATH
      value: /usr/local/bin/helm
    # https://github.com/jkroepke/helm-secrets/wiki/Security-in-shared-environments
    - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
      value: "false"
    # Required: Argo CD hands value files to helm as absolute paths.
    - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
      value: "true"
    - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
      value: "false"
    - name: HELM_SECRETS_WRAPPER_ENABLED
      value: "true"
    - name: HELM_SECRETS_DECRYPT_SECRETS_IN_TMP_DIR
      value: "true"
    # The age private key, mounted from the `sops-age` secret below.
    - name: SOPS_AGE_KEY_FILE
      value: /helm-secrets-private-keys/keys.txt

  volumes:
    - name: gitops-tools
      emptyDir: {}
    # Created by hand at bootstrap; never defined by a manifest, so no `apply`
    # can clobber it. See BOOTSTRAP.md step 3.
    - name: sops-age
      secret:
        secretName: sops-age

  volumeMounts:
    - name: gitops-tools
      mountPath: /gitops-tools
    # The helm-secrets wrapper shadows the real helm binary: /usr/local/sbin
    # precedes /usr/local/bin on PATH.
    - name: gitops-tools
      mountPath: /usr/local/sbin/helm
      subPath: helm
    - name: sops-age
      mountPath: /helm-secrets-private-keys

  initContainers:
    - name: download-tools
      image: alpine:3.22
      imagePullPolicy: IfNotPresent
      command: [sh, -euc]
      env:
        - name: HELM_SECRETS_VERSION
          value: "4.7.7"
        - name: SOPS_VERSION
          value: "3.13.3"
        - name: AGE_VERSION
          value: "1.3.2"
        - name: HELM_PLUGINS
          value: /gitops-tools/helm-plugins/
        - name: HELM_SECRETS_CURL_PATH
          value: /gitops-tools/curl
        - name: HELM_SECRETS_SOPS_PATH
          value: /gitops-tools/sops
        - name: HELM_SECRETS_AGE_PATH
          value: /gitops-tools/age
      args:
        - |
          mkdir -p "${HELM_PLUGINS}"

          CURL_ARCH=$(uname -m | sed -e 's/x86_64/amd64/')
          wget -qO "${HELM_SECRETS_CURL_PATH}" \
            "https://github.com/moparisthebest/static-curl/releases/latest/download/curl-${CURL_ARCH}"

          GO_ARCH=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64$/arm64/')
          wget -qO "${HELM_SECRETS_SOPS_PATH}" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.${GO_ARCH}"
          wget -qO- "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-${GO_ARCH}.tar.gz" \
            | tar -xzf- --strip-components=1 -C "${HELM_SECRETS_AGE_PATH%/*}" age/age

          for part in secrets secrets-getter secrets-post-renderer; do
            wget -qO- "https://github.com/jkroepke/helm-secrets/releases/download/v${HELM_SECRETS_VERSION}/${part}-${HELM_SECRETS_VERSION}.tgz" \
              | tar -C "${HELM_PLUGINS}" -xzf-
          done

          chmod +x "${HELM_SECRETS_CURL_PATH}" "${HELM_SECRETS_SOPS_PATH}" "${HELM_SECRETS_AGE_PATH}"

          cp "${HELM_PLUGINS}/secrets/scripts/wrapper/helm.sh" /gitops-tools/helm
      volumeMounts:
        - name: gitops-tools
          mountPath: /gitops-tools

# One node, one replica of everything. HA would schedule pods that can never
# spread.
controller:
  replicas: 1
server:
  replicas: 1
applicationSet:
  replicas: 1
redis-ha:
  enabled: false
